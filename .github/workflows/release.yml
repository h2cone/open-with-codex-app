name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  PROJECT_NAME: open-with-codex-app

jobs:
  build:
    name: Build ${{ matrix.archive_target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_target: x86_64-linux
            archive_ext: tar.gz
            binary_ext: ''
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive_target: aarch64-linux
            archive_ext: tar.gz
            binary_ext: ''
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_target: x86_64-darwin
            archive_ext: tar.gz
            binary_ext: ''
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_target: aarch64-darwin
            archive_ext: tar.gz
            binary_ext: ''
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_target: x86_64-windows
            archive_ext: zip
            binary_ext: .exe
            use_cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target "${{ matrix.target }}"
          else
            cargo build --release --target "${{ matrix.target }}"
          fi

      - name: Package tarball
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          binary="${PROJECT_NAME}${{ matrix.binary_ext }}"
          package_dir="dist/${PROJECT_NAME}-${tag}-${{ matrix.archive_target }}"
          versioned_archive="${PROJECT_NAME}-${tag}-${{ matrix.archive_target }}.tar.gz"

          mkdir -p "$package_dir"
          cp "target/${{ matrix.target }}/release/$binary" "$package_dir/"
          chmod +x "$package_dir/$binary"
          tar -C dist -czf "dist/$versioned_archive" "${PROJECT_NAME}-${tag}-${{ matrix.archive_target }}"

      - name: Package zip
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          $binary = "${env:PROJECT_NAME}${{ matrix.binary_ext }}"
          $packageDir = "dist/${env:PROJECT_NAME}-$tag-${{ matrix.archive_target }}"
          $versionedArchive = "dist/${env:PROJECT_NAME}-$tag-${{ matrix.archive_target }}.zip"

          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$binary" $packageDir
          Compress-Archive -Path "$packageDir/*" -DestinationPath $versionedArchive -Force

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ github.ref_name }}-${{ matrix.archive_target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release-notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import pathlib
          import re
          import subprocess

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag[1:] if tag.startswith("v") else tag
          changelog = pathlib.Path("CHANGELOG.md")
          body = ""

          if changelog.exists():
              text = changelog.read_text(encoding="utf-8")
              heading = re.compile(
                  rf"^##\s+(?:\[[vV]?{re.escape(version)}\]|[vV]?{re.escape(version)})\s*(?:-.*?)?$",
                  re.MULTILINE,
              )
              match = heading.search(text)
              if match:
                  start = match.end()
                  next_heading = re.search(r"^##\s+", text[start:], re.MULTILINE)
                  end = start + next_heading.start() if next_heading else len(text)
                  body = text[start:end].strip()

          if not body:
              try:
                  previous = subprocess.check_output(
                      ["git", "describe", "--tags", "--abbrev=0", f"{tag}^"],
                      stderr=subprocess.DEVNULL,
                      text=True,
                  ).strip()
              except subprocess.CalledProcessError:
                  previous = ""

              range_spec = f"{previous}..{tag}" if previous else tag
              try:
                  log = subprocess.check_output(
                      ["git", "log", "--oneline", range_spec],
                      text=True,
                  ).strip()
              except subprocess.CalledProcessError:
                  log = ""

              if log:
                  body = "Changes in this release:\n\n" + "\n".join(
                      f"- {line}" for line in log.splitlines()
                  )
              else:
                  body = f"Release {tag}."

          pathlib.Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          PY

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build
      - release-notes
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ${{ env.PROJECT_NAME }}-${{ github.ref_name }}-*
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes/release-notes.md
          files: dist/*
